<!doctype html>
<!-- Open through any static server (npx serve, python3 -m http.server): browsers don't run modules from file://. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>light-dial example</title>
  <style>
    body {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 56px;
      min-height: 100vh;
      margin: 0;
      background: #f0efed;
      color: #2a2624;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    light-dial { width: 260px; }
    light-dial:not(:defined) { display: block; height: 56px; }
    .objects { display: flex; align-items: center; gap: 56px; }
    .card { width: 160px; height: 110px; border-radius: 14px; background: #fff; }
    .sphere {
      width: 120px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(ellipse 100% 100% at var(--x, 50%) var(--y, 28%),
        #fff3e6 0%, #f2b48d 14%, #c9714a 40%, #5b2c1b 74%, #3a1a10 100%);
    }
  </style>
</head>
<body>
  <light-dial angle="-40" intensity="80"></light-dial>
  <div class="objects">
    <div class="card"></div>
    <div class="sphere"></div>
  </div>

  <script type="module">
    import "./light-dial.js";

    const dial = document.querySelector("light-dial");
    const card = document.querySelector(".card");
    const sphere = document.querySelector(".sphere");

    function light({ angle, intensity }) {
      const a = (angle * Math.PI) / 180;
      const power = intensity / 100;

      // the card's shadow falls away from the lamp, longer and darker as the light grows
      const length = 3 + 9 * power;
      card.style.boxShadow =
        `${-Math.sin(a) * length}px ${-Math.cos(a) * length}px ` +
        `${6 + 10 * power}px rgb(0 0 0 / ${0.3 * Math.min(power, 1)})`;

      // the lamp stands a little above the sphere; its brightest point faces the lamp,
      // and when the lamp goes behind, the point slides past the edge and only a rim stays lit
      const lift = 0.6;
      const x = Math.sin(a) * Math.cos(lift);
      const z = Math.cos(a) * Math.cos(lift);
      const reach = 0.8 * (1 + Math.max(0, -z) * 1.6);
      sphere.style.setProperty("--x", `${50 + 50 * x * reach}%`);
      sphere.style.setProperty("--y", `${50 - 50 * Math.sin(lift) * reach}%`);
      sphere.style.filter = `brightness(${Math.min(1.4, 0.06 + 0.94 * (intensity / 80))})`;
    }

    light(dial.value);
    dial.addEventListener("input", (event) => light(event.detail));
  </script>
</body>
</html>
